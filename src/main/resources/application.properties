spring.application.name=knowtion
server.port=8080

# Conexión a PostgreSQL (Cambia localhost:5432 y knowtion_db según tu caso)
spring.datasource.url= ${SOURCE_URL}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.profiles.active=local

# Seguridad JWT
# El secreto debe tener MÍNIMO 32 caracteres (requisito de HS256).
jwt.secret=${JWT_SECRET}
# Vigencia del token: 3600000 ms = 1 hora
jwt.expiration-ms=3600000